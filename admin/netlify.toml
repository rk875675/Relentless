[build]
  publish = "."

# Serve promo-admin.html at the site root without changing the URL, so the
# file keeps its descriptive name for local file:// use too.
[[redirects]]
  from = "/"
  to = "/promo-admin.html"
  status = 200

# Defense in depth around the existing password gate (see
# supabase/functions/promo-admin/index.ts): keep this page out of search
# indexes, block framing, and avoid leaking referrer data.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"
